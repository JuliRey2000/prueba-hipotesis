[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prueba-hipotesis"
version = "0.1.0"
description = "Motor para validar hipótesis de trading con pre-registro, permutaciones, Holm y prueba fuera de muestra"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "statsmodels",
    "arch",
]

[project.optional-dependencies]
yahoo = ["yfinance"]

[tool.setuptools]
packages = ["prueba_hipotesis"]
